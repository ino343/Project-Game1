<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aldenmoor Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800&family=Pixelify+Sans:wght@500;700&family=Cinzel:wght@600;700&family=Outfit:wght@600;700&family=Rajdhani:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="../css/base.css?v=t31" />
    <link rel="stylesheet" href="../css/components.css?v=t31" />
    <link rel="stylesheet" href="../css/game.css?v=t31" />
    <link rel="stylesheet" href="../css/hud.css?v=t31" />
    <link rel="stylesheet" href="../css/dialog.css?v=t31" />
    <link rel="stylesheet" href="../css/classic.css?v=t31" />
  </head>
  <body class="game">
    <div id="app">
      <canvas id="cv"></canvas>

      <!-- top-left: player frame (+ damage meter near the village dummies) -->
      <div id="hud-left" class="hud pad-l">
        <div id="stat" hidden>
          <div class="pr"><span class="pl">Life</span><div class="bar hp" id="hpb"><i></i><b>0/0</b></div></div>
          <div class="pr"><span class="pl" id="plv">Lvl 0</span><div class="bar xp" id="xpb"><i></i><b>EXP</b></div></div>
          <div class="pr"><span class="pl">Mana</span><div class="bar mp" id="mpb"><i></i><b>0/0</b></div></div>
          <div class="pr"><span class="pl" id="pmlv">Mlvl 0</span><div class="bar ms" id="msb"><i></i><b>0%</b></div></div>
          <div id="buffs"></div>
        </div>

        <div id="qtrack" hidden></div>

      <div id="dps" hidden>
          <div class="dh"><b>Damage Test</b><button id="dReset" type="button">Reset</button></div>
          <div class="dg">
            <span>Attack speed</span><b id="dAs">—</b>
            <span>DPS</span><b id="dDps">0</b>
            <span>Last hit</span><b id="dLast">—</b>
            <span>Highest hit</span><b id="dMax">0</b>
            <span>Average hit</span><b id="dAvg">0</b>
            <span>Crit rate</span><b id="dCrit">0%</b>
            <span>Total damage</span><b id="dTot">0</b>
          </div>
          <small id="dNote"></small>
        </div>
      </div>

      <!-- top-right: menu bar + location (minimap is drawn on the canvas below this) -->
      <div id="info" class="hud pad-r" hidden>
        <nav id="dock" aria-label="Menu">
          <button id="bItems" type="button" title="Items bag (I)">Items</button>
          <button id="bMap" type="button" title="World map (N)">Map</button>
          <button id="bGear" type="button" title="Gears: equipment and costumes (G)">Gears</button>
          <button id="bChar" type="button" title="Abilities: stats, attributes and skills (C)">Abilities<em class="pip" hidden></em></button>
          <button id="bFriends" type="button" title="Friends (F)">Friends</button>
          <button id="bSet" type="button" title="Options (O)">Option</button>
        </nav>
        <div class="plate">
          <div id="mapname">Aldenmoor Village<small>Safe zone</small></div>
        </div>
      </div>

      <!-- bottom-left: chat log + input -->
      <div id="comms" class="hud pad-l">
        <div id="log" aria-live="polite"></div>
        <div id="chat" hidden><input id="chatIn" type="text" maxlength="120" autocomplete="off" spellcheck="false" placeholder="Type a message, or /help" aria-label="Chat" /></div>
      </div>
      <button id="warp" type="button" hidden aria-label="Warp to village" title="Warp to village"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Warp</span><small>Village</small></button>
      <div id="bar" hidden></div>
      <div id="toast"></div>

      <div id="dlg" class="overlay" hidden><div class="card" id="dlgcard"></div></div>
      <div id="fade"></div>
    </div>

    <!-- Load order matters: scripts share one global scope (no build step needed). -->
    <script src="../js/shared/utils.js?v=t31"></script>
    <script src="../js/shared/storage.js?v=t31"></script>

    <script src="../js/data/config.js?v=t31"></script>
    <script src="../js/data/skills.js?v=t31"></script>
    <script src="../js/data/jobs.js?v=t31"></script>
    <script src="../js/data/items.js?v=t31"></script>
    <script src="../js/data/costumes.js?v=t31"></script>
    <script src="../js/shared/itemicons.js?v=t31"></script>
    <script src="../js/shared/icons-weapons.js?v=t31"></script>
    <script src="../js/shared/icons-armor.js?v=t31"></script>
    <script src="../js/shared/icons-head.js?v=t31"></script>
    <script src="../js/shared/icons-neck.js?v=t31"></script>
    <script src="../js/shared/icons-costume.js?v=t31"></script>
    <script src="../js/data/monsters.js?v=t31"></script>
    <script src="../js/data/materials.js?v=t31"></script>
    <script src="../js/data/maps.js?v=t31"></script>
    <script src="../js/data/appearance.js?v=t31"></script>
    <script src="../js/shared/avatar.js?v=t31"></script>
    <script src="../js/shared/avatar-costume.js?v=t31"></script>

    <script src="../js/audio/sfx.js?v=t31"></script>
    <script src="../js/audio/music.js?v=t31"></script>

    <script src="../js/game/state.js?v=t31"></script>
    <script src="../js/game/player.js?v=t31"></script>
    <script src="../js/game/feedback.js?v=t31"></script>
    <script src="../js/game/world.js?v=t31"></script>
    <script src="../js/game/combat.js?v=t31"></script>
    <script src="../js/game/pets.js?v=t31"></script>
    <script src="../js/game/dummy.js?v=t31"></script>
    <script src="../js/game/update.js?v=t31"></script>
    <script src="../js/game/render/terrain.js?v=t31"></script>
    <script src="../js/game/render/village.js?v=t31"></script>
    <script src="../js/game/render/entities.js?v=t31"></script>
    <script src="../js/game/render/effects.js?v=t31"></script>
    <script src="../js/game/render/scene.js?v=t31"></script>
    <script src="../js/game/hud.js?v=t31"></script>
    <script src="../js/game/dialogs.js?v=t31"></script>
    <script src="../js/game/npcs.js?v=t31"></script>
    <script src="../js/game/lifecycle.js?v=t31"></script>
    <script src="../js/game/settings.js?v=t31"></script>
    <script src="../js/game/chat.js?v=t31"></script>
    <script src="../js/game/input.js?v=t31"></script>
    <script src="../js/game/main.js?v=t31"></script>
  </body>
</html>
